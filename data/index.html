<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pitch</title>

  <!-- Google Font estilo "Arial mejorado" -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #111111;
      font-family: 'Inter', Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 20px;
    }

    .line {
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.3;
      margin-bottom: 24px;
      font-weight: 300;
      letter-spacing: -0.02em;
    }

    .bold {
      font-weight: 600;
    }

    .spacer {
      height: 60px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 60px 16px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="line">Esto no es un chatbot.</div>
    <div class="line">Es una nueva forma de entender a los candidatos.</div>

    <div class="spacer"></div>

    <div class="line">Mientras otros filtran CVs,</div>
    <div class="line">nosotros escuchamos cómo piensan.</div>

    <div class="spacer"></div>

    <div class="line">No evaluamos respuestas.</div>
    <div class="line bold">Evaluamos preguntas.</div>

    <div class="spacer"></div>

    <div class="line">Porque ahí vive el potencial real.</div>

    <div class="spacer"></div>

    <div class="line">Y si puedes medir eso,</div>
    <div class="line bold">puedes cambiar cómo se contrata.</div>

  </div>
</body>
</html>
