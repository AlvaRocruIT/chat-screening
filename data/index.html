<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pitch</title>

  <!-- Google Font estilo "Arial mejorado" -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #111111;
      font-family: 'Inter', Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 20px;
    }

    .line {
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.3;
      margin-bottom: 24px;
      font-weight: 300;
      letter-spacing: -0.02em;
    }

    .bold {
      font-weight: 600;
    }

    .spacer {
      height: 60px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 60px 16px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="line">Esto no es un chatbot.<br>
    Es una nueva forma de entender a los candidatos.<br>
    Mientras otros filtran CVs,<br>
    nosotros escuchamos cómo piensan.<br>
    No evaluamos respuestas.<br>
    Evaluamos preguntas.<br>
    Porque ahí vive el potencial real.<br>
    Y si puedes medir eso,<br>
    puedes cambiar cómo se contrata.</div>
  </div>
</body>
</html>
