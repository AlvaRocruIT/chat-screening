<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo del proyecto "Chatea con la vacante"</title>

  <!-- Fuente Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Nuevo stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Chatea con tu próximo puesto de trabajo</h1>
  <p>Solo para comenzar<br>
  Te pediremos tu nombre y correo</p>

   <button id="sendBtn">Nombre</button>
    <textarea id="userInput" rows="4" placeholder="Juli@" autocomplete="off" autocapitalize="none" spellcheck="false"></textarea>

  <button id="sendBtn">Correo</button>
  <textarea id="currentResponse" rows="4" readonly placeholder="Juli@correo.com"></textarea>

  <h3>Historial</h3>
  <button id="toggleHistoryBtn" onclick="toggleHistory()">¿Por qué necesitan estos datos?</button>
  <textarea id="historyBox" rows="8" readonly placeholder="Pulsa el botón para mostrar/ocultar el historial"></textarea>

  <script type="module" src="main.js?v=4"></script>
</body>
</html>
