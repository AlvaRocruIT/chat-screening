<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Screening</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="app">

    <!-- Estado inicial centrado -->
    <div id="center-screen">

      <!-- Título -->
      <h1>Chatea con tu próximo puesto de trabajo</h1>

      <!-- Bajada -->
      <p>Puedes preguntar acerca de la organización, su cultura y detalles sobre este rol.</p>

      <!-- Input centrado -->
      <div id="input-container center">
        <textarea 
          id="chat-input" 
          rows="1" 
          placeholder="¿Qué quieres saber sobre este rol?"
        ></textarea>

        <button id="send-btn" disabled>&#8629;</button>
      </div>
    </div>

    <!-- Chat (oculto inicialmente) -->
    <div id="chat-container" class="hidden"></div>

    <!-- Input tipo ChatGPT -->
    <div id="input-wrapper">
      
      <textarea 
        id="chat-input-bottom" 
        rows="1" 
        placeholder="¡Hola! 👋🏻 ¿Qué te gustaría saber?"
      ></textarea>

      <button id="send-btn-bottom" disabled>&#8629;</button>
    </div>
  </div>

  <script>
    const centerScreen = document.getElementById('center-screen');
    const chat = document.getElementById('chat-container');

    const inputTop = document.getElementById('chat-input');
    const buttonTop = document.getElementById('send-btn');

    const inputBottom = document.getElementById('chat-input-bottom');
    const buttonBottom = document.getElementById('send-btn-bottom');
    const inputBottomContainer = document.getElementById('input-container-bottom');

    /* Auto resize */
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    /* Activar botón */
    function toggleButton(input, button) {
      button.disabled = input.value.trim().length === 0;
    }

    inputTop.addEventListener('input', function () {
      autoResize(this);
      toggleButton(this, buttonTop);
    });

    inputBottom.addEventListener('input', function () {
      autoResize(this);
      toggleButton(this, buttonBottom);
    });

    function sendMessage(text) {
      if (!text) return;

      /* Transición de layout */
      centerScreen.classList.add('hidden');
      chat.classList.remove('hidden');
      inputBottomContainer.classList.remove('hidden');

      /* Mensaje usuario */
      const msg = document.createElement('div');
      msg.className = 'message user';
      msg.textContent = text;
      chat.appendChild(msg);

      chat.scrollTop = chat.scrollHeight;

      /* Respuesta fake */
      setTimeout(function () {
        const reply = document.createElement('div');
        reply.className = 'message bot';
        reply.textContent = 'Procesando tu consulta...';
        chat.appendChild(reply);
        chat.scrollTop = chat.scrollHeight;
      }, 500);
    }

    /* Envío TOP */
    function sendTop() {
      const text = inputTop.value.trim();
      if (!text) return;
      inputTop.value = '';
      buttonTop.disabled = true;
      sendMessage(text);
    }

    /* Envío BOTTOM */
    function sendBottom() {
      const text = inputBottom.value.trim();
      if (!text) return;
      inputBottom.value = '';
      buttonBottom.disabled = true;
      sendMessage(text);
    }

    /* Eventos */
    inputTop.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendTop();
      }
    });

    inputBottom.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendBottom();
      }
    });

    buttonTop.addEventListener('click', sendTop);
    buttonBottom.addEventListener('click', sendBottom);
  </script>
</body>
</html>
