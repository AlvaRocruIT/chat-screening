<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Screening</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Contenedor principal -->
  <div id="app">

    <!-- Pantalla inicial -->
    <div id="welcome-screen">
      <h1>Chatea con tu próximo puesto de trabajo</h1>
      <p>Puedes preguntar acerca de la organización, su cultura y detalles sobre este rol.</p>
    </div>

    <!-- Chat -->
    <div id="chat-container"></div>

    <!-- Input -->
    <div id="input-container">
      <textarea 
        id="chat-input" 
        rows="1" 
        placeholder="¿Qué quieres saber sobre este rol?"
      ></textarea>

      <!-- Botón enviar -->
      <button id="send-btn" disabled>&#8629;</button>
    </div>

  </div>

  <script>
    const input = document.getElementById('chat-input');
    const button = document.getElementById('send-btn');
    const chat = document.getElementById('chat-container');
    const welcome = document.getElementById('welcome-screen');

    /* Auto resize */
    input.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
      button.disabled = this.value.trim().length === 0;
    });

    /* Enviar mensaje */
    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      /* Ocultar bienvenida */
      welcome.style.display = 'none';

      /* Mensaje usuario */
      const msg = document.createElement('div');
      msg.className = 'message user';
      msg.textContent = text;
      chat.appendChild(msg);

      /* Reset */
      input.value = '';
      input.style.height = 'auto';
      button.disabled = true;

      chat.scrollTop = chat.scrollHeight;

      /* Simulación respuesta */
      setTimeout(function () {
        const reply = document.createElement('div');
        reply.className = 'message bot';
        reply.textContent = 'Procesando tu consulta...';
        chat.appendChild(reply);
        chat.scrollTop = chat.scrollHeight;
      }, 500);
    }

    /* Enter para enviar */
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    button.addEventListener('click', sendMessage);
  </script>

</body>
</html>
