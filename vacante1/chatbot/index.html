<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- Pantalla inicial -->
  <div id="start-screen">
    <h1>Chatea con tu próximo puesto de trabajo</h1>
    <p>Puedes preguntar acerca de la organización, su cultura y detalles sobre este rol.</p>
    <div class="input-wrapper" id="input-box">
      <textarea id="chat-input" placeholder="¿Qué quieres saber sobre este rol?"></textarea>
      <button id="send-btn">&#8629;</button>
    </div>
  </div>

  <!-- Chat -->
  <div id="chat-screen" class="hidden">
    <div id="messages"></div>

    <div class="input-wrapper bottom">
      <textarea id="input-chat"></textarea>
      <button id="btn-chat">&#8629;</button>
    </div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
