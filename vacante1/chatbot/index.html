<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat Screening</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Contenedor principal -->
  <div id="app">

    <!-- Estado inicial (pantalla centrada) -->
    <div id="welcome-screen">
      <h1>Chatea con tu próximo puesto de trabajo</h1>
      <p>Puedes preguntar acerca de la organización, su cultura y detalles sobre este rol.</p>
    </div>

    <!-- Contenedor de mensajes -->
    <div id="chat-container"></div>

    <!-- Input fijo inferior -->
    <div id="input-container">
      <textarea 
        id="chat-input" 
        rows="1" 
        placeholder="¿Qué quieres saber sobre este rol?"
      ></textarea>

      <!-- Botón enviar -->
      <button id="send-btn" disabled>
        ↩
      </button>
    </div>

  </div>

  <script>
    const input = document.getElementById("chat-input");
    const button = document.getElementById("send-btn");
    const chat = document.getElementById("chat-container");
    const welcome = document.getElementById("welcome-screen");

    /* Auto-resize del textarea */
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";

      /* Activar botón */
      button.disabled = input.value.trim().length === 0;
    });

    /* Enviar mensaje */
    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      /* Ocultar pantalla inicial */
      welcome.style.display = "none";

      /* Crear mensaje usuario */
      const msg = document.createElement("div");
      msg.className = "message user";
      msg.innerText = text;
      chat.appendChild(msg);

      /* Reset input */
      input.value = "";
      input.style.height = "auto";
      button.disabled = true;

      /* Scroll automático */
      chat.scrollTop = chat.scrollHeight;

      /* Simulación respuesta */
      setTimeout(() => {
        const reply = document.createElement("div");
        reply.className = "message bot";
        reply.innerText = "Procesando tu consulta...";
        chat.appendChild(reply);
        chat.scrollTop = chat.scrollHeight;
      }, 500);
    }

    /* Enter para enviar */
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    button.addEventListener("click", sendMessage);
  </script>

</body>
</html>
